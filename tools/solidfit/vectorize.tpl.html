<!doctype html><html><head><meta charset="utf-8"><title>vectorize</title></head><body>
<pre id="out">running</pre>
<script src="imgs.js"></script>
<script src="vectorize.js"></script>
<script>
(async function(){
  var res=[];
  for (var i=0;i<window.__FIGS__.length;i++){
    var f=window.__FIGS__[i];
    try {
      var img=await window.solidfit.loadImage(f.src);
      var out=window.solidfit.vectorizeImage(img, f.opts||{});
      out.name=f.name;
      res.push(out);
    } catch(e){ res.push({name:f.name, error:String((e&&e.stack)||(e&&e.message)||e)}); }
  }
  document.getElementById("out").textContent = "@@BEGIN@@\n" + JSON.stringify(res) + "\n@@END@@";
})();
</script></body></html>
