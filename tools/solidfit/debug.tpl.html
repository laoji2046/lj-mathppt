<!doctype html><html><head><meta charset="utf-8"><title>skeleton debug</title><style>body{margin:0;background:#fff}canvas{display:block;margin:10px;border:1px solid #ccc}</style></head><body>
<script src="imgs.js"></script>
<script src="_vec.js"></script>
<script>
(async function(){
  var S=window.solidfit;
  var f=window.__FIGS__[0];
  var img=await S.loadImage(f.src);
  var opt=f.opts||{};
  var m=S.toInk(img, opt.crop);
  var W=m.W,H=m.H,box=m.box;
  var diag=Math.hypot(box[2]-box[0],box[3]-box[1]);
  var comp=S.components(m.ink,W,H,box);
  var st=S.stripText(comp,W,diag,m.ink,opt);
  var sk=S.thin(st.ink,W,H);
  var G=S.buildGraph(sk,W,H);
  var c=document.createElement("canvas"); c.width=W; c.height=H;
  var g=c.getContext("2d");
  var id=g.createImageData(W,H);
  for(var i=0;i<W*H;i++){
    var v=255;
    if(m.ink[i]) v=225;            // 原始墨迹（浅灰）
    if(st.ink[i] && !m.ink[i]) v=225;
    if(sk[i]) v=120;               // 骨架（中灰）
    id.data[i*4]=v; id.data[i*4+1]=v; id.data[i*4+2]=v; id.data[i*4+3]=255;
  }
  g.putImageData(id,0,0);
  // 节点
  g.fillStyle="#e02020";
  for(var n=0;n<G.nodes.length;n++){ g.beginPath(); g.arc(G.nodes[n].cx,G.nodes[n].cy,2.5,0,6.3); g.fill(); }
  // 路径
  g.strokeStyle="rgba(30,90,240,0.85)"; g.lineWidth=1;
  for(var p=0;p<G.paths.length;p++){ var pts=G.paths[p].pts; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(var q=1;q<pts.length;q++) g.lineTo(pts[q][0],pts[q][1]); g.stroke(); }
  document.body.appendChild(c);
  var info=document.createElement("pre");
  info.textContent="nodes="+G.nodes.length+" paths="+G.paths.length+" skPix="+(function(){var n2=0;for(var i2=0;i2<W*H;i2++) if(sk[i2]) n2++; return n2;})();
  document.body.appendChild(info);
})();
</script></body></html>
