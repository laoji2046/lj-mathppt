[package]
name = "revealslidr"
version = "1.0.0"
description = "LJ-PPT — Reveal.js 所见即所得幻灯片编辑器"
authors = ["LTJ Studio"]
edition = "2021"

[lib]
name = "revealslidr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "0.0.14"
