[package]
name = "lj-mathslides"
version = "0.1.0"
description = "LJ-MathSlides — 场景图驱动的幻灯片编辑器（Vue 版）"
authors = ["LJ"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lj_mathslides_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
# 内容库（公式/图形/试题/课件）：bundled = 自带 SQLite 源码编译，离线不依赖系统
rusqlite = { version = "0.32", features = ["bundled"] }
# 「试题库 → 导入 PDF（MinerU）」：**在 Rust 侧发 HTTP** —— 网页端直接 fetch mineru.net 会被 CORS 挡掉
# （实测 webview 里 Failed to fetch，而 PowerShell 里 200）。blocking + rustls：不依赖系统 OpenSSL。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
# MinerU 精准解析返回的是 zip（里面有 full.md / content_list.json / 图片）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 直接把 rustls 拉成直接依赖：reqwest 用 rustls 时必须安装进程级 CryptoProvider，
# 否则第一次请求 panic（命令里 panic 不会回给前端 → 看着像"永远不返回"）。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
