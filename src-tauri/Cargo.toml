[package]
name = "lj-mathslides"
version = "0.1.0"
description = "LJ-MathSlides — 场景图驱动的幻灯片编辑器（Vue 版）"
authors = ["LJ"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lj_mathslides_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
